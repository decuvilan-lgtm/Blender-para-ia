name: Blender Live Session

on:
  push:
    paths:
      - ".github/workflows/blender-live-session.yml"
      - "session_system/scenes/**"
  workflow_dispatch:
    inputs:
      project_path:
        description: "Optional .blend project in the repository"
        required: false
        type: string
        default: ""

permissions:
  contents: write

jobs:
  blender-live:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Publish run identifier for artifact retrieval
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p session_system/output
          cat > session_system/output/latest-run.json <<EOF
          {
            "run_id": "$GITHUB_RUN_ID",
            "run_number": "$GITHUB_RUN_NUMBER",
            "commit": "$GITHUB_SHA",
            "run_url": "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          }
          EOF
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add session_system/output/latest-run.json
          if ! git diff --cached --quiet; then
            git commit -m "Publish latest Blender evidence run ID"
            git push
          fi

      - name: Validate project and install remote desktop
        env:
          REQUESTED_PROJECT: \${{ inputs.project_path }}
        run: |
          set -euo pipefail
          project="$REQUESTED_PROJECT"
          if [[ -n "$project" ]]; then
            case "$project" in /*|*..*|*\\*) echo "Unsafe project path" >&2; exit 1;; esac
            [[ "$project" == *.blend && -f "$project" ]] || { echo "Project .blend not found"; exit 1; }
          fi
          echo "PROJECT_PATH=$project" >> "$GITHUB_ENV"
          sudo apt-get update
          sudo apt-get install -y xvfb openbox wmctrl xdotool x11-utils x11-xserver-utils mesa-utils libgl1-mesa-dri libgl1 libegl1 libxi6 libxrender1 libxkbcommon0 libxkbcommon-x11-0 libsm6 libxfixes3 ffmpeg x11vnc novnc websockify nginx ca-certificates curl gnupg
          python -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/pip" install --upgrade pip pillow mss
          echo "PYTHON_BIN=$RUNNER_TEMP/venv/bin/python" >> "$GITHUB_ENV"
          curl --fail --location --retry 3 "https://download.blender.org/release/Blender4.5/blender-4.5.3-linux-x64.tar.xz" -o "$RUNNER_TEMP/blender.tar.xz"
          mkdir -p "$RUNNER_TEMP/blender"
          tar -xf "$RUNNER_TEMP/blender.tar.xz" -C "$RUNNER_TEMP/blender"
          echo "BLENDER_BIN=$RUNNER_TEMP/blender/blender-4.5.3-linux-x64/blender" >> "$GITHUB_ENV"

          curl --fail --location --retry 3 https://pkg.cloudflare.com/cloudflare-main.gpg | sudo tee /usr/share/keyrings/cloudflare-main.gpg >/dev/null
          echo "deb [signed-by=/usr/share/keyrings/cloudflare-main.gpg] https://pkg.cloudflare.com/cloudflared any main" | sudo tee /etc/apt/sources.list.d/cloudflared.list >/dev/null
          sudo apt-get update
          sudo apt-get install -y cloudflared
          install -m 0755 "$(command -v cloudflared)" "$RUNNER_TEMP/cloudflared"
          "$RUNNER_TEMP/cloudflared" --version

      - name: Start Blender GUI and authenticated remote desktop
        shell: bash
        run: |
          set -euo pipefail
          export BLENDER_BRIDGE_TOKEN="$(openssl rand -hex 32)"
          export BLENDER_REMOTE_API_TOKEN="$(openssl rand -hex 32)"
          export DISPLAY=:99 LIBGL_ALWAYS_SOFTWARE=1 GALLIUM_DRIVER=llvmpipe
          mkdir -p "$RUNNER_TEMP/blender-artifacts"
          Xvfb :99 -screen 0 1600x900x24 +extension GLX +render -noreset > "$RUNNER_TEMP/xvfb.log" 2>&1 &
          echo $! > "$RUNNER_TEMP/xvfb.pid"
          for i in $(seq 1 30); do xdpyinfo -display :99 >/dev/null 2>&1 && break; sleep 1; done
          openbox > "$RUNNER_TEMP/openbox.log" 2>&1 & echo $! > "$RUNNER_TEMP/openbox.pid"
          sleep 2
          args=(--window-geometry 0 0 1600 900 --window-maximized)
          if [[ -n "$PROJECT_PATH" ]]; then args=("$PROJECT_PATH" "\${args[@]}"); else args=(--factory-startup "\${args[@]}"); fi
          args+=(--python session_system/blender_bridge/bridge.py)
          args+=(--python session_system/scenes/create_anime_girl.py)
          export BLENDER_BRIDGE_PORT=8765 BLENDER_ARTIFACT_DIR="$RUNNER_TEMP/blender-artifacts"
          "$BLENDER_BIN" "\${args[@]}" > "$RUNNER_TEMP/blender.log" 2>&1 &
          echo $! > "$RUNNER_TEMP/blender.pid"
          for i in $(seq 1 180); do
            if [[ -s "$RUNNER_TEMP/blender-artifacts/anime_girl.blend" && -s "$RUNNER_TEMP/blender-artifacts/anime_girl_preview.png" && -s "$RUNNER_TEMP/blender-artifacts/anime_girl_animation.mp4" ]]; then break; fi
            if ! kill -0 "$(cat "$RUNNER_TEMP/blender.pid")" 2>/dev/null; then cat "$RUNNER_TEMP/blender.log"; exit 1; fi
            sleep 2
          done
          test -s "$RUNNER_TEMP/blender-artifacts/anime_girl.blend"
          test -s "$RUNNER_TEMP/blender-artifacts/anime_girl_preview.png"
          test -s "$RUNNER_TEMP/blender-artifacts/anime_girl_animation.mp4"
          "$PYTHON_BIN" session_system/repo_headless/client.py ping --timeout 15
          "$PYTHON_BIN" session_system/repo_headless/client.py scene-info --timeout 30 > "$RUNNER_TEMP/blender-artifacts/scene-info.json"

          VNC_PASSWORD="$(openssl rand -hex 8)"
          echo "$VNC_PASSWORD" > "$RUNNER_TEMP/vnc-password"
          x11vnc -display :99 -forever -shared -rfbport 5900 -passwd "$VNC_PASSWORD" -localhost -noxdamage > "$RUNNER_TEMP/x11vnc.log" 2>&1 &
          echo $! > "$RUNNER_TEMP/x11vnc.pid"
          websockify --web=/usr/share/novnc/ 6080 localhost:5900 > "$RUNNER_TEMP/websockify.log" 2>&1 &
          echo $! > "$RUNNER_TEMP/websockify.pid"

          sudo tee /etc/nginx/sites-available/blender-live >/dev/null <<'NGINX'
          server {
            listen 8080;
            server_name _;
            location /api/ {
              proxy_pass http://127.0.0.1:8766/api/;
              proxy_set_header Host $host;
            }
            location = /vnc.html { proxy_pass http://127.0.0.1:6080/vnc.html; }
            location /app/ { proxy_pass http://127.0.0.1:6080/app/; }
            location /core/ { proxy_pass http://127.0.0.1:6080/core/; }
            location /vendor/ { proxy_pass http://127.0.0.1:6080/vendor/; }
            location /include/ { proxy_pass http://127.0.0.1:6080/include/; }
            location /websockify {
              proxy_pass http://127.0.0.1:6080/websockify;
              proxy_http_version 1.1;
              proxy_set_header Upgrade $http_upgrade;
              proxy_set_header Connection "Upgrade";
            }
            location / {
              proxy_pass http://127.0.0.1:8766/;
              proxy_set_header Host $host;
            }
          }
          NGINX
          sudo rm -f /etc/nginx/sites-enabled/default
          sudo ln -sf /etc/nginx/sites-available/blender-live /etc/nginx/sites-enabled/blender-live
          sudo nginx -t && sudo systemctl restart nginx

          export GITHUB_WORKSPACE="$GITHUB_WORKSPACE"
          export BLENDER_CLIENT="$PYTHON_BIN"
          nohup "$PYTHON_BIN" session_system/remote/control_server.py > "$RUNNER_TEMP/control-api.log" 2>&1 < /dev/null &
          echo $! > "$RUNNER_TEMP/control-api.pid"
          nohup "$RUNNER_TEMP/cloudflared" tunnel --no-autoupdate --url http://127.0.0.1:8080 > "$RUNNER_TEMP/cloudflared.log" 2>&1 < /dev/null &
          echo $! > "$RUNNER_TEMP/cloudflared.pid"
          for i in $(seq 1 60); do
            URL="$(grep -Eo 'https://[a-z0-9-]+\.trycloudflare\.com' "$RUNNER_TEMP/cloudflared.log" | head -n1 || true)"
            [[ -n "$URL" ]] && break
            sleep 2
          done
          if [[ -z "\${URL:-}" ]]; then cat "$RUNNER_TEMP/cloudflared.log"; exit 1; fi
          echo "::notice title=Blender Live URL::$URL/#$BLENDER_REMOTE_API_TOKEN"
          echo "::notice title=VNC password::$VNC_PASSWORD"
          echo "Remote session ready: $URL"

      - name: Record final GUI evidence
        run: |
          set -euo pipefail
          "$PYTHON_BIN" session_system/scripts/capture_screen.py "$RUNNER_TEMP/blender-artifacts/desktop.png"
          cp "$RUNNER_TEMP"/blender.log "$RUNNER_TEMP"/xvfb.log "$RUNNER_TEMP"/openbox.log "$RUNNER_TEMP"/cloudflared.log "$RUNNER_TEMP/blender-artifacts/" 2>/dev/null || true
          test -s "$RUNNER_TEMP/blender-artifacts/anime_girl.blend"
          test -s "$RUNNER_TEMP/blender-artifacts/anime_girl_preview.png"
          test -s "$RUNNER_TEMP/blender-artifacts/anime_girl_animation.mp4"

      - name: Keep live inspection available briefly
        shell: bash
        run: |
          echo "Anime girl is built in the Blender GUI. Live inspection window: 3 minutes."
          sleep 180

      - name: Upload Blender project and video evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: anime-girl-blender-evidence
          path: \${{ runner.temp }}/blender-artifacts/
          if-no-files-found: error
          retention-days: 14
