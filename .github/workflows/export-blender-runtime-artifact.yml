name: Export Blender runtime for Environment A transfer

on:
  push:
    paths:
      - ".github/workflows/export-blender-runtime-artifact.yml"
  workflow_dispatch:

permissions:
  contents: read
  actions: write

jobs:
  export-runtime:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Download and verify preserved GitHub Release asset
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p runtime-transfer
          curl --fail --location --retry 5 --retry-all-errors --retry-delay 5 \
            "https://github.com/decuvilan-lgtm/Blender-para-ia/releases/download/blender-4.5.3-linux-x64/blender-4.5.3-linux-x64.tar.xz" \
            -o runtime-transfer/blender-4.5.3-linux-x64.tar.xz
          echo "975c58fcb244273838534bba771e64ad87739216b0f9b39a888531a49a72d845  runtime-transfer/blender-4.5.3-linux-x64.tar.xz" | sha256sum --check
          test "$(stat -c%s runtime-transfer/blender-4.5.3-linux-x64.tar.xz)" -eq 377397328
          split -b 80M -d -a 2 runtime-transfer/blender-4.5.3-linux-x64.tar.xz runtime-transfer/part-
          (cd runtime-transfer && sha256sum part-* > parts.sha256)
          test "$(find runtime-transfer -maxdepth 1 -name 'part-*' | wc -l)" -eq 5

      - name: Upload chunk 00
        uses: actions/upload-artifact@v4
        with:
          name: blender-runtime-part-00
          path: runtime-transfer/part-00
          if-no-files-found: error
          retention-days: 30

      - name: Upload chunk 01
        uses: actions/upload-artifact@v4
        with:
          name: blender-runtime-part-01
          path: runtime-transfer/part-01
          if-no-files-found: error
          retention-days: 30

      - name: Upload chunk 02
        uses: actions/upload-artifact@v4
        with:
          name: blender-runtime-part-02
          path: runtime-transfer/part-02
          if-no-files-found: error
          retention-days: 30

      - name: Upload chunk 03
        uses: actions/upload-artifact@v4
        with:
          name: blender-runtime-part-03
          path: runtime-transfer/part-03
          if-no-files-found: error
          retention-days: 30

      - name: Upload chunk 04
        uses: actions/upload-artifact@v4
        with:
          name: blender-runtime-part-04
          path: runtime-transfer/part-04
          if-no-files-found: error
          retention-days: 30

      - name: Upload chunk checksums
        uses: actions/upload-artifact@v4
        with:
          name: blender-runtime-parts-checksums
          path: runtime-transfer/parts.sha256
          if-no-files-found: error
          retention-days: 30
