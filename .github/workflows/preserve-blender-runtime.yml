name: Preserve Blender runtime in GitHub Release

on:
  push:
    paths:
      - ".github/workflows/preserve-blender-runtime.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: preserve-blender-runtime-4-5-3
  cancel-in-progress: false

jobs:
  package-and-publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Download official Blender 4.5.3 Linux x64 archive
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/blender-release"
          cd "$RUNNER_TEMP/blender-release"
          curl --fail --location --retry 5 --retry-all-errors --retry-delay 5 \
            https://download.blender.org/release/Blender4.5/blender-4.5.3-linux-x64.tar.xz \
            -o blender-4.5.3-linux-x64.tar.xz
          curl --fail --location --retry 5 --retry-all-errors --retry-delay 5 \
            https://download.blender.org/release/Blender4.5/blender-4.5.3.sha256 \
            -o blender-4.5.3.sha256
          grep 'blender-4.5.3-linux-x64.tar.xz$' blender-4.5.3.sha256 > blender-checksum.txt
          test -s blender-checksum.txt
          sha256sum --check blender-checksum.txt
          test "$(stat -c%s blender-4.5.3-linux-x64.tar.xz)" -gt 300000000

      - name: Publish versioned runtime asset
        uses: softprops/action-gh-release@v2
        with:
          tag_name: blender-4.5.3-linux-x64
          name: Blender 4.5.3 Linux x64 — Runtime A
          body: |
            Official Blender 4.5.3 Linux x64 binary archive for the isolated experimental headless environment A.
            Source: https://download.blender.org/release/Blender4.5/
            The archive is checksum-verified against Blender's official SHA-256 manifest before publication.
            This release asset is intentionally kept outside Git history.
          files: ${{ runner.temp }}/blender-release/blender-4.5.3-linux-x64.tar.xz
          fail_on_unmatched_files: true
          make_latest: false
