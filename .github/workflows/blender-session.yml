name: Blender GUI Session

on:
  push:
    paths:
      - ".github/workflows/blender-session.yml"
      - "session_system/blender_bridge/bridge.py"
      - "session_system/repo_headless/client.py"
  workflow_dispatch:
    inputs:
      command:
        description: "Operation to execute in the active Blender GUI session"
        required: true
        type: choice
        default: scene-info
        options:
          - ping
          - scene-info
          - create-demo
          - render
          - visual-test
          - save
      project_path:
        description: "Optional .blend file committed to the repository (for example projects/inbox/test.blend)"
        required: false
        type: string
        default: ""
      session_minutes:
        description: "Maximum session duration (1-10 minutes)"
        required: true
        type: number
        default: 10

permissions:
  contents: read

concurrency:
  group: blender-gui-session
  cancel-in-progress: false

jobs:
  blender-session:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate inputs
        id: config
        shell: bash
        env:
          REQUESTED_MINUTES: ${{ inputs.session_minutes }}
          REQUESTED_PROJECT: ${{ inputs.project_path }}
        run: |
          requested="$REQUESTED_MINUTES"
          if ! [[ "$requested" =~ ^[0-9]+$ ]]; then requested=10; fi
          if (( requested < 1 )); then requested=1; fi
          if (( requested > 10 )); then requested=10; fi
          echo "minutes=$requested" >> "$GITHUB_OUTPUT"

          project="$REQUESTED_PROJECT"
          if [[ -n "$project" ]]; then
            case "$project" in
              /*|*..*|*\\*) echo "Unsafe project_path: $project" >&2; exit 1 ;;
            esac
            [[ "$project" == *.blend ]] || { echo "project_path must end in .blend" >&2; exit 1; }
            [[ -f "$project" ]] || { echo "Project not found in repository: $project" >&2; exit 1; }
            echo "project=$project" >> "$GITHUB_OUTPUT"
            echo "Loading project: $project"
          else
            echo "project=" >> "$GITHUB_OUTPUT"
            echo "No project supplied; Blender will open its factory startup scene."
          fi

      - name: Install GUI, software OpenGL and capture dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb openbox wmctrl xdotool x11-utils x11-xserver-utils mesa-utils libgl1-mesa-dri libgl1 libegl1 libxi6 libxrender1 libxkbcommon0 libxkbcommon-x11-0 libsm6 libxfixes3 ffmpeg
          python -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/pip" install --upgrade pip
          "$RUNNER_TEMP/venv/bin/pip" install mss pillow
          echo "PYTHON_BIN=$RUNNER_TEMP/venv/bin/python" >> "$GITHUB_ENV"

      - name: Download pinned Blender build
        env:
          BLENDER_VERSION: "4.5.3"
          BLENDER_MAJOR_MINOR: "4.5"
        run: |
          mkdir -p "$RUNNER_TEMP/blender"
          curl --fail --location --retry 3 --retry-all-errors --retry-delay 5 \
            "https://download.blender.org/release/Blender${BLENDER_MAJOR_MINOR}/blender-${BLENDER_VERSION}-linux-x64.tar.xz" \
            -o "$RUNNER_TEMP/blender/blender.tar.xz"
          tar -xf "$RUNNER_TEMP/blender/blender.tar.xz" -C "$RUNNER_TEMP/blender"
          echo "BLENDER_BIN=$(find "$RUNNER_TEMP/blender" -maxdepth 3 -type f -name blender -perm -u+x | head -n 1)" >> "$GITHUB_ENV"

      - name: Start virtual desktop and Blender GUI
        env:
          BLENDER_BRIDGE_TOKEN: ${{ secrets.BLENDER_BRIDGE_TOKEN || github.run_id }}
          BLENDER_BRIDGE_PORT: "8765"
          BLENDER_ARTIFACT_DIR: ${{ runner.temp }}/blender-artifacts
          PROJECT_PATH: ${{ steps.config.outputs.project }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$BLENDER_ARTIFACT_DIR"
          export DISPLAY=:99
          export LIBGL_ALWAYS_SOFTWARE=1
          export GALLIUM_DRIVER=llvmpipe
          Xvfb :99 -screen 0 1600x900x24 +extension GLX +render -noreset > "$RUNNER_TEMP/xvfb.log" 2>&1 &
          echo $! > "$RUNNER_TEMP/xvfb.pid"
          for attempt in $(seq 1 30); do
            xdpyinfo -display :99 >/dev/null 2>&1 && break
            sleep 1
          done
          xdpyinfo -display :99 >/dev/null
          openbox > "$RUNNER_TEMP/openbox.log" 2>&1 &
          echo $! > "$RUNNER_TEMP/openbox.pid"
          sleep 2
          glxinfo -B > "$RUNNER_TEMP/glxinfo.log" 2>&1 || true

          blender_args=(--window-geometry 0 0 1600 900 --window-maximized)
          if [[ -n "$PROJECT_PATH" ]]; then
            blender_args=("$PROJECT_PATH" "${blender_args[@]}")
          else
            blender_args=(--factory-startup "${blender_args[@]}")
          fi
          blender_args+=(--python session_system/blender_bridge/bridge.py)
          "$BLENDER_BIN" "${blender_args[@]}" > "$RUNNER_TEMP/blender.log" 2>&1 &
          echo $! > "$RUNNER_TEMP/blender.pid"
          echo "BLENDER_BRIDGE_TOKEN=$BLENDER_BRIDGE_TOKEN" >> "$GITHUB_ENV"
          echo "BLENDER_BRIDGE_PORT=8765" >> "$GITHUB_ENV"
          echo "BLENDER_ARTIFACT_DIR=$BLENDER_ARTIFACT_DIR" >> "$GITHUB_ENV"
          echo "BLENDER_SESSION_STARTED_AT=$(date +%s)" >> "$GITHUB_ENV"

          sleep 8
          window_id="$(wmctrl -l | awk 'tolower($0) ~ /blender/ {print $1; exit}')"
          if [[ -z "$window_id" ]]; then
            echo "Blender X11 window was not found by wmctrl." >&2
            wmctrl -l || true
            exit 1
          fi
          wmctrl -ir "$window_id" -b add,maximized_vert,maximized_horz
          xdotool windowactivate --sync "$window_id"
          xdotool key --clearmodifiers Escape
          sleep 3
          wmctrl -lG > "$RUNNER_TEMP/windows-geometry.txt"
          xwininfo -display :99 -root -tree > "$RUNNER_TEMP/windows.txt" 2>&1 || true
          if ! awk 'tolower($0) ~ /blender/ && $5 >= 1400 && $6 >= 750 {ok=1} END {exit !ok}' "$RUNNER_TEMP/windows-geometry.txt"; then
            echo "Blender window did not occupy the expected desktop area." >&2
            cat "$RUNNER_TEMP/windows-geometry.txt"
            exit 1
          fi
          {
            echo "DISPLAY=:99"
            echo "LIBGL_ALWAYS_SOFTWARE=$LIBGL_ALWAYS_SOFTWARE"
            echo "GALLIUM_DRIVER=$GALLIUM_DRIVER"
            echo "BLENDER_WINDOW_ID=$window_id"
          } > "$RUNNER_TEMP/display-diagnostics.txt"
          cat "$RUNNER_TEMP/windows-geometry.txt"
          cat "$RUNNER_TEMP/windows.txt"

      - name: Wait for Blender Bridge
        shell: bash
        run: |
          for attempt in $(seq 1 60); do
            if "$PYTHON_BIN" session_system/repo_headless/client.py ping --timeout 3; then
              exit 0
            fi
            sleep 2
          done
          echo "Blender Bridge did not become ready." >&2
          cat "$RUNNER_TEMP/blender.log" || true
          cat "$RUNNER_TEMP/xvfb.log" || true
          exit 1

      - name: Verify Blender GUI window exists
        shell: bash
        run: |
          cat "$RUNNER_TEMP/windows.txt"
          if ! grep -qi "Blender" "$RUNNER_TEMP/windows.txt"; then
            echo "A Blender window was not found in the X11 window tree." >&2
            cat "$RUNNER_TEMP/blender.log" || true
            cat "$RUNNER_TEMP/openbox.log" || true
            exit 1
          fi

      - name: Start full-session video recording
        if: success()
        env:
          DISPLAY: ":99"
          BLENDER_ARTIFACT_DIR: ${{ runner.temp }}/blender-artifacts
        shell: bash
        run: |
          set -euo pipefail
          ffmpeg -y -loglevel warning -f x11grab -draw_mouse 1 -video_size 1600x900 -framerate 6 -i :99.0 \
            -an -c:v libx264 -preset ultrafast -crf 30 -pix_fmt yuv420p \
            -movflags +faststart "$BLENDER_ARTIFACT_DIR/full-session.mp4" \
            > "$RUNNER_TEMP/recording.log" 2>&1 &
          echo $! > "$RUNNER_TEMP/recording.pid"
          sleep 2
          kill -0 "$(cat "$RUNNER_TEMP/recording.pid")"
      - name: Execute requested operation through repository headless client
        env:
          BLENDER_COMMAND: ${{ inputs.command || 'visual-test' }}
        run: |
          "$PYTHON_BIN" session_system/repo_headless/client.py "$BLENDER_COMMAND" --timeout 180
          if [[ "$BLENDER_COMMAND" != "save" ]]; then
            "$PYTHON_BIN" session_system/repo_headless/client.py save --timeout 180
          fi

      - name: Capture and validate desktop and short evidence video
        if: always()
        env:
          DISPLAY: ":99"
          BLENDER_ARTIFACT_DIR: ${{ runner.temp }}/blender-artifacts
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$BLENDER_ARTIFACT_DIR"
          if [[ -f "$RUNNER_TEMP/blender.pid" ]] && kill -0 "$(cat "$RUNNER_TEMP/blender.pid")" 2>/dev/null; then
            "$PYTHON_BIN" session_system/scripts/capture_screen.py "$BLENDER_ARTIFACT_DIR/desktop.png"
            ffmpeg -y -loglevel error -f x11grab -video_size 1600x900 -framerate 8 -i :99.0 -t 5 \
              -pix_fmt yuv420p "$BLENDER_ARTIFACT_DIR/session-preview.mp4"
            ffmpeg -y -loglevel error -i "$BLENDER_ARTIFACT_DIR/session-preview.mp4" -frames:v 1 "$BLENDER_ARTIFACT_DIR/video-first-frame.png"
            "$PYTHON_BIN" -c 'from PIL import Image,ImageStat; import sys; im=Image.open(sys.argv[1]).convert("RGB"); s=ImageStat.Stat(im); mean=sum(s.mean)/3; std=sum(s.stddev)/3; print(f"Video frame mean={mean:.2f}, stddev={std:.2f}"); sys.exit(1 if mean < 2 or std < 1 else 0)' "$BLENDER_ARTIFACT_DIR/video-first-frame.png"
          else
            echo "Blender process is not alive; visual evidence cannot be captured." >&2
            exit 1
          fi

      - name: Keep session alive for configured duration
        if: success()
        run: |
          target=$(( ${{ steps.config.outputs.minutes }} * 60 ))
          started="${BLENDER_SESSION_STARTED_AT:-$(date +%s)}"
          while true; do
            now=$(date +%s)
            elapsed=$((now - started))
            (( elapsed >= target )) && break
            if ! kill -0 "$(cat "$RUNNER_TEMP/blender.pid")" 2>/dev/null; then
              echo "Blender exited before the session window ended."
              exit 1
            fi
            remaining=$((target - elapsed))
            sleep_for=10
            (( remaining < sleep_for )) && sleep_for=$remaining
            sleep "$sleep_for"
          done

      - name: Stop full-session video recording
        if: always()
        shell: bash
        run: |
          if [[ -f "$RUNNER_TEMP/recording.pid" ]]; then
            recorder="$(cat "$RUNNER_TEMP/recording.pid")"
            kill -INT "$recorder" 2>/dev/null || true
            for attempt in $(seq 1 15); do
              kill -0 "$recorder" 2>/dev/null || break
              sleep 1
            done
            kill -KILL "$recorder" 2>/dev/null || true
          fi
          if [[ -f "$RUNNER_TEMP/blender-artifacts/full-session.mp4" ]]; then
            ffmpeg -y -loglevel error -i "$RUNNER_TEMP/blender-artifacts/full-session.mp4" -frames:v 1 "$RUNNER_TEMP/blender-artifacts/full-session-poster.png"
          fi
      - name: Stop Blender and virtual display
        if: always()
        run: |
          if [[ -f "$RUNNER_TEMP/blender.pid" ]]; then kill "$(cat "$RUNNER_TEMP/blender.pid")" 2>/dev/null || true; fi
          if [[ -f "$RUNNER_TEMP/openbox.pid" ]]; then kill "$(cat "$RUNNER_TEMP/openbox.pid")" 2>/dev/null || true; fi
          if [[ -f "$RUNNER_TEMP/xvfb.pid" ]]; then kill "$(cat "$RUNNER_TEMP/xvfb.pid")" 2>/dev/null || true; fi

      - name: Package experimental lab
        if: always()
        run: |
          mkdir -p "$RUNNER_TEMP/package"
          cp -R ai_lab/experimental "$RUNNER_TEMP/package/"
          tar -czf "$RUNNER_TEMP/experimental-blender-lab.tar.gz" -C "$RUNNER_TEMP/package" .

      - name: Upload session evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: blender-session-evidence
          path: |
            ${{ runner.temp }}/blender-artifacts/
            ${{ runner.temp }}/blender.log
            ${{ runner.temp }}/xvfb.log
            ${{ runner.temp }}/openbox.log
            ${{ runner.temp }}/glxinfo.log
            ${{ runner.temp }}/windows.txt
            ${{ runner.temp }}/windows-geometry.txt
            ${{ runner.temp }}/display-diagnostics.txt
            ${{ runner.temp }}/recording.log
          if-no-files-found: warn
          retention-days: 14

      - name: Upload experimental headless lab
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: experimental-blender-headless
          path: ${{ runner.temp }}/experimental-blender-lab.tar.gz
          if-no-files-found: error
          retention-days: 14
