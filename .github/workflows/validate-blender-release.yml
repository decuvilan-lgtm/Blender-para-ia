name: Validate preserved Blender runtime and scene pipeline

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/validate-blender-release.yml"
      - "ai_lab/experimental/scripts/create_validation_scene.py"
      - "ai_lab/experimental/scripts/validate_project.py"

permissions:
  contents: read

jobs:
  validate-release:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download and verify pinned Blender release
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/blender"
          curl --fail --location --retry 5 --retry-all-errors --retry-delay 5 \
            "https://github.com/decuvilan-lgtm/Blender-para-ia/releases/download/blender-4.5.3-linux-x64/blender-4.5.3-linux-x64.tar.xz" \
            -o "$RUNNER_TEMP/blender/blender.tar.xz"
          echo "975c58fcb244273838534bba771e64ad87739216b0f9b39a888531a49a72d845  $RUNNER_TEMP/blender/blender.tar.xz" | sha256sum --check
          test "$(stat -c%s "$RUNNER_TEMP/blender/blender.tar.xz")" -eq 377397328
          tar -xJf "$RUNNER_TEMP/blender/blender.tar.xz" -C "$RUNNER_TEMP/blender"
          BLENDER_BIN="$RUNNER_TEMP/blender/blender-4.5.3-linux-x64/blender"
          test -x "$BLENDER_BIN"
          "$BLENDER_BIN" --version
          echo "BLENDER_BIN=$BLENDER_BIN" >> "$GITHUB_ENV"

      - name: Create and render validation scene
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/validation"
          "$BLENDER_BIN" --background --factory-startup \
            --python ai_lab/experimental/scripts/create_validation_scene.py \
            -- "$RUNNER_TEMP/validation/a-validation.blend"
          test -s "$RUNNER_TEMP/validation/a-validation.blend"
          test -s "$RUNNER_TEMP/validation/a-validation.png"

      - name: Reopen and validate saved project
        shell: bash
        run: |
          set -euo pipefail
          "$BLENDER_BIN" --background "$RUNNER_TEMP/validation/a-validation.blend" \
            --python ai_lab/experimental/scripts/validate_project.py
          echo "RELEASE_PIPELINE_VALIDATION_OK"

      - name: Upload Blender project and render evidence
        uses: actions/upload-artifact@v4
        with:
          name: blender-release-validation-evidence
          path: |
            ${{ runner.temp }}/validation/a-validation.blend
            ${{ runner.temp }}/validation/a-validation.png
          if-no-files-found: error
          retention-days: 14
